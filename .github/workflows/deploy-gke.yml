name: Deploy to GCP Kubernetes

# Trigger when a pull request is merged into main
on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  IMAGE: ${{ secrets.GCP_PROJECT_ID }}/app
  REGISTRY: gcr.io

jobs:
  deploy:
    name: Build and Deploy to GKE
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Option A: Authenticate via Workload Identity Federation (recommended)
      # Uncomment and configure if using WIF:
      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      #     service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # Option B: Authenticate via Service Account Key JSON (simpler setup)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag "$REGISTRY/$IMAGE:$GITHUB_SHA" \
            --tag "$REGISTRY/$IMAGE:latest" \
            .

      - name: Push Docker image to GCR
        run: |
          docker push "$REGISTRY/$IMAGE:$GITHUB_SHA"
          docker push "$REGISTRY/$IMAGE:latest"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}

      - name: Deploy to GKE
        run: |
          # Update the image tag in the deployment
          kubectl set image deployment/app app="$REGISTRY/$IMAGE:$GITHUB_SHA"

          # Wait for rollout to complete
          kubectl rollout status deployment/app
