<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Summarizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 2.5rem;
      width: 100%;
      max-width: 680px;
    }
    h1 { font-size: 1.6rem; color: #1a1a2e; margin-bottom: 0.4rem; }
    p.subtitle { color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
    .upload-area {
      border: 2px dashed #d0d7de;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 1.2rem;
    }
    .upload-area:hover { border-color: #4f46e5; }
    .upload-area input[type=file] { display: none; }
    .upload-area label {
      cursor: pointer;
      color: #4f46e5;
      font-weight: 500;
    }
    .file-name { font-size: 0.85rem; color: #555; margin-top: 0.5rem; }
    button {
      width: 100%;
      padding: 0.8rem;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    .result {
      margin-top: 2rem;
      display: none;
    }
    .result h2 { font-size: 1.1rem; color: #1a1a2e; margin-bottom: 0.8rem; }
    .summary-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1.2rem 1.5rem;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #334155;
    }
    .error { color: #dc2626; margin-top: 1rem; font-size: 0.9rem; }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Meeting Summarizer</h1>
    <p class="subtitle">Upload a .txt file of your meeting minutes to extract key decisions and action items.</p>

    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept=".txt" />
      <label for="fileInput">Click to choose a .txt file</label>
      <div class="file-name" id="fileName">No file selected</div>
    </div>

    <button id="submitBtn" disabled onclick="summarize()">Summarize</button>
    <div class="error" id="errorMsg"></div>

    <div class="result" id="result">
      <h2>Summary</h2>
      <div class="summary-box" id="summaryBox"></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const submitBtn = document.getElementById('submitBtn');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        fileName.textContent = fileInput.files[0].name;
        submitBtn.disabled = false;
      }
    });

    async function summarize() {
      const file = fileInput.files[0];
      if (!file) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Summarizing...';
      document.getElementById('errorMsg').textContent = '';
      document.getElementById('result').style.display = 'none';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/summarize', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.error) {
          document.getElementById('errorMsg').textContent = data.error;
        } else {
          document.getElementById('summaryBox').textContent = data.summary;
          document.getElementById('result').style.display = 'block';
        }
      } catch (e) {
        document.getElementById('errorMsg').textContent = 'Something went wrong. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Summarize';
      }
    }
  </script>
</body>
</html>
